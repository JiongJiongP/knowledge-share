server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.80.3}:3306/knowledge_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:192.168.80.3}
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.80.3}
    port: 5672
    username: admin
    password: admin123
  elasticsearch:
    uris: ${ES_URIS:http://192.168.80.3:9200}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: knowledge-platform-secret-key-min-256-bits!!
  expiration: 86400000

qdrant:
  host: ${QDRANT_HOST:192.168.80.3}
  port: ${QDRANT_PORT:6334}

minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.80.3:9000}
  access-key: admin
  secret-key: admin123456
  bucket: knowledge-files
