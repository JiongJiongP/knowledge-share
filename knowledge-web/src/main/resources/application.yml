server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
  elasticsearch:
    uris: http://localhost:9200
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: knowledge-platform-secret-key-min-256-bits!!
  expiration: 86400000

qdrant:
  host: localhost
  port: 6334

minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: admin123456
  bucket: knowledge-files
