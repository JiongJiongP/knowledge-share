jwt:
  secret: test-secret-key-for-unit-tests-min-256-bits!!

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;INIT=RUNSCRIPT FROM 'classpath:schema-h2.sql'
    driver-class-name: org.h2.Driver
    username: sa
    password:

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
